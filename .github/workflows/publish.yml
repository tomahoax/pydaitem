# PyPI publishing via trusted publishing (OIDC): no token to store.
#
# One-time setup at https://pypi.org/manage/account/publishing/: declare this repository
# as a trusted publisher for the "pydaitem" project, naming the workflow (publish.yml) and
# the environment (pypi).
#
# Ordering matters: publish the library BEFORE releasing the ha-daitem version that pins
# it, otherwise installation breaks for users.

name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Never publish what the tests reject, nor a version the tag does not name.
      - name: Test
        run: |
          python -m pip install --upgrade pip build
          pip install -e ".[dev]"
          pytest -q

      - name: Check the tag names the packaged version
        if: github.event_name == 'release'
        run: |
          version=$(python -c "import pydaitem; print(pydaitem.__version__)")
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match version ${version}" >&2
            exit 1
          fi

      - name: Build artifacts
        run: python -m build

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
