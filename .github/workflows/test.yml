name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Type check (mypy)
        run: |
          mypy src/pydaitem
          mypy scripts

      - name: Unit tests
        run: pytest -q

  oldest-aiohttp:
    # The dependency floor in pyproject.toml is a promise to hosts that pin an older aiohttp
    # (Home Assistant pins its own): test against exactly that version, read from the file.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install the oldest aiohttp the package accepts
        run: |
          python -m pip install --upgrade pip
          floor=$(python -c 'import tomllib; deps = tomllib.load(open("pyproject.toml", "rb"))["project"]["dependencies"]; print(next(d for d in deps if d.startswith("aiohttp")).replace(">=", "=="))')
          pip install -e ".[dev]" "$floor"
          python -c "import aiohttp, yarl; print('aiohttp', aiohttp.__version__, 'yarl', yarl.__version__)"

      - name: Unit tests
        run: pytest -q
