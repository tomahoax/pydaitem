# Daitem Secure API, as the app uses it: the single source of docs/api.
# Edited by hand. tests/test_api_spec.py checks it is consistent, and
# tests/test_api_spec_vs_library.py that pydaitem follows it.
openapi: 3.0.3
info:
  title: Topaze API, as used by the Daitem Secure app
  version: 6.0.3
  description: 'Private, non-contractual API of the Daitem Secure iOS app 6.0.3 (build 2026091101).
    Operations marked `x-observed` carry their notes in `x-observed-notes`; the narrative reference
    for them is docs/api-daitem.md. `x-coverage` says how pydaitem reaches each operation: `facade`
    through DaitemSystem, `client` on the low-level client only.'
  x-retry-policy:
    maxRetries: 2
    delaySeconds: '0.5'
    rules:
    - when: HTTP 401
      then: Refresh the Keycloak token, then retry (2 retries at most).
    - when: HTTP 403 on keepAlive
      then: 'The panel session is gone: start the session-lost flow, do not retry.'
    - when: HTTP 403, 428, 500-599
      then: Decode the error body and translate its message.
    - when: Other failures
      then: Retry after 0.5 s (2 retries at most), then give up.
servers:
- url: https://appv3.tt-monitor.com/topaze
security:
- keycloak:
  - openid
  appName: []
tags:
- name: auth
  description: Sign-in and app session
- name: panel
  description: Panel session and state
- name: commands
  description: Alarm commands
- name: inventory
  description: Installation and devices
- name: schedule
  description: Arming schedule
- name: automation
  description: Automations (shutters, lights, gates)
- name: scenarios
  description: Scenarios
- name: logbook
  description: Event log
- name: video
  description: Cameras and video
- name: notifications
  description: Push, e-mail alerts and contacts
- name: users
  description: Users, codes and rights
- name: misc
  description: Widgets, upsell and feedback
paths:
  /auth:
    get:
      operationId: getAuth
      tags:
      - auth
      summary: Authorization page (code flow with PKCE S256, scope openid)
      description: client_id daitem-secure-app, redirect_uri daitemsecure://auth.
      x-coverage: facade
      responses:
        '200':
          $ref: '#/components/responses/OkUnmodelled'
        default:
          $ref: '#/components/responses/Error'
      servers:
      - url: https://auth.atraltech.com/realms/daitem/protocol/openid-connect
      security: []
      parameters: []
  /token:
    post:
      operationId: postToken
      tags:
      - auth
      summary: Exchange the code, or refresh the access token
      description: Form-encoded. The app keeps accessToken, refreshToken, expiresIn and refreshExpiresIn.
      x-coverage: facade
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoAuthToken'
        default:
          $ref: '#/components/responses/Error'
      servers:
      - url: https://auth.atraltech.com/realms/daitem/protocol/openid-connect
      security: []
      parameters: []
  /logout:
    post:
      operationId: postLogout
      tags:
      - auth
      summary: Close the Keycloak session
      x-coverage: facade
      responses:
        '200':
          $ref: '#/components/responses/OkUnmodelled'
        default:
          $ref: '#/components/responses/Error'
      servers:
      - url: https://auth.atraltech.com/realms/daitem/protocol/openid-connect
      security: []
      parameters: []
  /v1/user:
    parameters:
    - $ref: '#/components/parameters/SessionId'
    - $ref: '#/components/parameters/Vendor'
    get:
      operationId: getV1User
      tags:
      - auth
      summary: Signed-in user (id used by the widget endpoints)
      x-coverage: facade
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopazeAuthUserInfo'
        default:
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-observed: true
  /authenticate/logout:
    parameters:
    - $ref: '#/components/parameters/SessionId'
    - $ref: '#/components/parameters/Vendor'
    post:
      operationId: postAuthenticateLogout
      tags:
      - auth
      summary: Log the app out of Topaze
      description: The body carries the id token twice, as idToken and id_token.
      x-coverage: client
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TopazeLogoutRequest'
      responses:
        '200':
          $ref: '#/components/responses/OkUnmodelled'
        default:
          $ref: '#/components/responses/Error'
  /v2/authenticate/logout:
    parameters:
    - $ref: '#/components/parameters/SessionId'
    post:
      operationId: postV2AuthenticateLogout
      tags:
      - auth
      summary: Log out, newer variant
      x-coverage: client
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TopazeLogoutRequest'
      responses:
        '200':
          $ref: '#/components/responses/OkUnmodelled'
        default:
          $ref: '#/components/responses/Error'
  /authenticate/keepAlive:
    parameters:
    - $ref: '#/components/parameters/SessionId'
    post:
      operationId: postAuthenticateKeepAlive
      tags:
      - panel
      summary: Keep the panel session open
      description: 'Optional for a client: a state read also keeps the session alive.'
      x-coverage: facade
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TopazeTokens'
      responses:
        '200':
          $ref: '#/components/responses/OkUnmodelled'
        default:
          $ref: '#/components/responses/Error'
      x-observed: true
      x-observed-notes: 'The only place the `ttmSessionId` returned by `connect` is reused. Optional in

        practice: polling the state alone holds the session for at least 20 minutes without

        any keepAlive. The mobile app sends one roughly every 8 minutes.'
  /v5/systems:
    parameters:
    - $ref: '#/components/parameters/SessionId'
    get:
      operationId: getV5Systems
      tags:
      - panel
      summary: Installations of the account
      x-coverage: facade
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TopazeSystem'
        default:
          $ref: '#/components/responses/Error'
      x-observed: true
      x-observed-notes: 'There is no "select" endpoint: selection is client-side. Pick an `id` and reuse
        it

        as `systemId` in every later call.'
  /v5/systems/{systemId}/connect:
    parameters:
    - $ref: '#/components/parameters/SystemId'
    - $ref: '#/components/parameters/SessionId'
    - $ref: '#/components/parameters/Vendor'
    - $ref: '#/components/parameters/ForwardedFor'
    post:
      operationId: postV5SystemsSystemIdConnect
      tags:
      - panel
      summary: Open the panel session with the user's code
      description: One session at a time across all accounts. Returns ttmSessionId, groups, rights and
        versions.
      x-coverage: facade
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TopazeConnectCredentials'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopazeConnectResult'
        default:
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/SessionBusy'
      x-observed: true
      x-observed-notes: 'Requires the alarm code **of the account being used**, which is not necessarily
        the

        owner''s master code: a restricted user has their own.


        This is the only operation that also requires the `X-App-Version` header.'
  /v5/systems/{systemId}/connect/{transactionId}:
    parameters:
    - $ref: '#/components/parameters/SystemId'
    - $ref: '#/components/parameters/TransactionId'
    - $ref: '#/components/parameters/SessionId'
    - $ref: '#/components/parameters/Vendor'
    get:
      operationId: getV5SystemsSystemIdConnectTransactionId
      tags:
      - panel
      summary: Poll a connect that answered asynchronously
      description: status PENDING until DONE. pydaitem polls it when connect answers without a session
        id.
      x-coverage: facade
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopazeAsyncResponseConnectResult'
        default:
          $ref: '#/components/responses/Error'
  /v5/systems/{systemId}/disconnect:
    parameters:
    - $ref: '#/components/parameters/SystemId'
    - $ref: '#/components/parameters/SessionId'
    post:
      operationId: postV5SystemsSystemIdDisconnect
      tags:
      - panel
      summary: Release the panel session
      x-coverage: facade
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TopazeDisconnect'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopazeDisconnectResult'
        default:
          $ref: '#/components/responses/Error'
      x-observed: true
      x-observed-notes: The body is required; without it the API answers `400 bad request body`.
  /v5/systems/{systemId}/state:
    parameters:
    - $ref: '#/components/parameters/SystemId'
    - $ref: '#/components/parameters/SessionId'
    get:
      operationId: getV5SystemsSystemIdState
      tags:
      - panel
      summary: Panel state, groups and open faults
      x-coverage: facade
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopazeSystemStateResult'
        default:
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/NoSession'
      x-observed: true
      x-observed-notes: 'Requires an existing panel session, held by any device. Two distinct `500`

        responses mean "no usable session", both remedied by `connect`:

        `status.nottmsessionid` (none at all) and `transmitter.error.invalidsessionid`

        (one exists but its id is stale).'
  /installation/isConnected:
    parameters:
    - $ref: '#/components/parameters/SessionId'
    post:
      operationId: postInstallationIsConnected
      tags:
      - panel
      summary: Whether the transmitter is online
      description: Connectivity sensor that needs no panel session. transmitterId comes from getConfiguration.
      x-coverage: facade
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TopazeIsConnectedInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopazeIsConnectedOutput'
        default:
          $ref: '#/components/responses/Error'
      x-observed: true
  /v5/systems/{systemId}/switchMode/{command}:
    parameters:
    - $ref: '#/components/parameters/SystemId'
    - name: command
      in: path
      required: true
      schema:
        type: string
    - $ref: '#/components/parameters/SessionId'
    post:
      operationId: postV5SystemsSystemIdSwitchModeCommand
      tags:
      - panel
      summary: Switch the panel to installation, test or use
      description: command is one of SwitchModeCommand. Installer territory, not for automation.
      x-coverage: client
      responses:
        '200':
          $ref: '#/components/responses/OkUnmodelled'
        default:
          $ref: '#/components/responses/Error'
  /v1/action/systems/{systemId}/sendSystemCommand:
    parameters:
    - $ref: '#/components/parameters/SystemId'
    - $ref: '#/components/parameters/SessionId'
    post:
      operationId: postV1ActionSystemsSystemIdSendSystemCommand
      tags:
      - commands
      summary: Arm or disarm everything
      x-coverage: facade
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TopazeSendSystemActivationCommandRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopazeSystemStateResult'
        default:
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/SessionBusy'
      x-observed: true
      x-observed-notes: '**Drives a real alarm.** Arming returns `tempo` first, then settles on `on` once

        the exit delay elapses. Disarming returns `off` immediately.'
  /v1/action/systems/{systemId}/sendGroupCommand:
    parameters:
    - $ref: '#/components/parameters/SystemId'
    - $ref: '#/components/parameters/SessionId'
    post:
      operationId: postV1ActionSystemsSystemIdSendGroupCommand
      tags:
      - commands
      summary: Arm or disarm chosen groups
      description: pydaitem arm_groups. Could become one switch per group.
      x-coverage: facade
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TopazeSendGroupCommandRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopazeSystemStateResult'
        default:
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/SessionBusy'
      x-observed: true
      x-observed-notes: '**Drives a real alarm.** The finest-grained primitive: several groups can be
        driven

        in one call. Arming returns `tempogroup` then `group`; disarming returns `off` with

        no delay.'
  /v1/action/systems/{systemId}/startPartialArmingWidgetCommand/{partialItemId}:
    parameters:
    - $ref: '#/components/parameters/SystemId'
    - name: partialItemId
      in: path
      required: true
      schema:
        type: string
    - $ref: '#/components/parameters/SessionId'
    post:
      operationId: postV1ActionSystemsSystemIdStartPartialArmingWidgetCommandPartialItemId
      tags:
      - commands
      summary: Start a partial arming preset
      description: 'Preset ids come from the partial arming widget: partial_arming_name_presence, _1 and
        _2.'
      x-coverage: facade
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopazeSystemStateResult'
        default:
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/SessionBusy'
      x-observed: true
      x-observed-notes: '**Drives a real alarm.** Takes no body. Returns `systemState: presence`.'
  /v1/action/systems/{systemId}/startAlertWidgetCommand/{alertId}:
    parameters:
    - $ref: '#/components/parameters/SystemId'
    - name: alertId
      in: path
      required: true
      schema:
        type: string
    - $ref: '#/components/parameters/SessionId'
    post:
      operationId: postV1ActionSystemsSystemIdStartAlertWidgetCommandAlertId
      tags:
      - commands
      summary: Trigger an alert (audible, silent or fire)
      description: Panic button. Expose only behind a confirmation, if at all.
      x-coverage: client
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopazeSystemStateResult'
        default:
          $ref: '#/components/responses/Error'
  /v1/action/systems/{systemId}/startScenarioWidgetCommand/{scenarioId}:
    parameters:
    - $ref: '#/components/parameters/SystemId'
    - $ref: '#/components/parameters/ScenarioId'
    - $ref: '#/components/parameters/SessionId'
    post:
      operationId: postV1ActionSystemsSystemIdStartScenarioWidgetCommandScenarioId
      tags:
      - commands
      summary: Run a scenario
      description: One scenario per entry, each runnable on its own.
      x-coverage: facade
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopazeSystemStateResult'
        default:
          $ref: '#/components/responses/Error'
  /v1/action/systems/{systemId}/sendAutomationWidgetCommand:
    parameters:
    - $ref: '#/components/parameters/SystemId'
    - $ref: '#/components/parameters/SessionId'
    post:
      operationId: postV1ActionSystemsSystemIdSendAutomationWidgetCommand
      tags:
      - automation
      summary: Drive an automation from its widget
      x-coverage: client
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TopazeSendAutomationCommandRequest'
      responses:
        '200':
          $ref: '#/components/responses/OkUnmodelled'
        default:
          $ref: '#/components/responses/Error'
  /v1/systems/{systemId}/actions/sendPpmsCommand:
    parameters:
    - $ref: '#/components/parameters/SystemId'
    - $ref: '#/components/parameters/SessionId'
    post:
      operationId: postV1SystemsSystemIdActionsSendPpmsCommand
      tags:
      - commands
      summary: Start or stop a safety plan alert (attack, natural hazard)
      description: Professional sites only (PPMS).
      x-coverage: client
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TopazeSendPpmsCommandRequest'
      responses:
        '200':
          $ref: '#/components/responses/OkUnmodelled'
        default:
          $ref: '#/components/responses/Error'
  /v2/systems/{systemId}/configuration:
    parameters:
    - $ref: '#/components/parameters/SystemId'
    - $ref: '#/components/parameters/SessionId'
    - $ref: '#/components/parameters/AppPlatform'
    get:
      operationId: getV2SystemsSystemIdConfiguration
      tags:
      - inventory
      summary: 'Full inventory: panel, detectors, sirens, keypads'
      x-coverage: facade
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopazeConfiguration'
        default:
          $ref: '#/components/responses/Error'
      x-observed: true
      x-observed-notes: 'Identity, group, inhibition and **faults** for every device.


        The API exposes **no live open/closed detector state**, and `type` is `DEFAULT` for

        every detector, so door, window and motion sensors cannot be told apart other than

        by the user-assigned name.'
  /v1/systems/{systemId}/products/{serialNumber}:
    parameters:
    - $ref: '#/components/parameters/SystemId'
    - name: serialNumber
      in: path
      required: true
      schema:
        type: string
    - $ref: '#/components/parameters/SessionId'
    patch:
      operationId: patchV1SystemsSystemIdProductsSerialNumber
      tags:
      - inventory
      summary: Inhibit or restore a device
      description: A switch per inhibitable device (isInhibitable in the inventory).
      x-coverage: client
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TopazeUpdateProductRequest'
      responses:
        '200':
          $ref: '#/components/responses/OkUnmodelled'
        default:
          $ref: '#/components/responses/Error'
  /v1/systems/{systemId}/updateFirmware:
    parameters:
    - $ref: '#/components/parameters/SystemId'
    - $ref: '#/components/parameters/SessionId'
    post:
      operationId: postV1SystemsSystemIdUpdateFirmware
      tags:
      - inventory
      summary: Start a firmware update
      description: 'The inventory already lists current and latest versions: an update entity is possible.'
      x-coverage: client
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TopazeFirmwareUpdateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopazeFirmwareUpdateStatusResponse'
        default:
          $ref: '#/components/responses/Error'
  /v5/configuration:
    parameters:
    - $ref: '#/components/parameters/SessionId'
    get:
      operationId: getV5Configuration
      tags:
      - inventory
      summary: Countries offered by the app
      x-coverage: client
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopazeEdaitemConfiguration'
        default:
          $ref: '#/components/responses/Error'
  /configuration/getConfiguration:
    parameters:
    - $ref: '#/components/parameters/SessionId'
    post:
      operationId: postConfigurationGetConfiguration
      tags:
      - inventory
      summary: Installation record by role and id
      description: Gives transmitterId and gprsPhone.
      x-coverage: facade
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TopazeGetConfigurationInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopazeConfigurationData'
        default:
          $ref: '#/components/responses/Error'
      x-observed: true
      x-observed-notes: Returns the panel and transmitter hardware identifiers.
  /v5/systems/{systemId}/name:
    parameters:
    - $ref: '#/components/parameters/SystemId'
    - $ref: '#/components/parameters/SessionId'
    put:
      operationId: putV5SystemsSystemIdName
      tags:
      - inventory
      summary: Rename the installation
      x-coverage: client
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TopazeModifySystemName'
      responses:
        '200':
          $ref: '#/components/responses/OkUnmodelled'
        default:
          $ref: '#/components/responses/Error'
  /v5/systems/{systemId}/gprs-phone-number:
    parameters:
    - $ref: '#/components/parameters/SystemId'
    - $ref: '#/components/parameters/SessionId'
    put:
      operationId: putV5SystemsSystemIdGprsPhoneNumber
      tags:
      - inventory
      summary: Set the GPRS transmitter phone number
      x-coverage: client
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TopazeUpdateGPRSPhoneRequest'
      responses:
        '200':
          $ref: '#/components/responses/OkUnmodelled'
        default:
          $ref: '#/components/responses/Error'
  /v5/systems/{systemId}/schedule:
    parameters:
    - $ref: '#/components/parameters/SystemId'
    - $ref: '#/components/parameters/SessionId'
    get:
      operationId: getV5SystemsSystemIdSchedule
      tags:
      - schedule
      summary: Arming schedule
      x-coverage: facade
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopazeSystemScheduleConfiguration'
        default:
          $ref: '#/components/responses/Error'
      x-observed: true
    post:
      operationId: postV5SystemsSystemIdSchedule
      tags:
      - schedule
      summary: Add a program
      x-coverage: client
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TopazeOnOffProgram'
      responses:
        '200':
          $ref: '#/components/responses/OkUnmodelled'
        default:
          $ref: '#/components/responses/Error'
  /v5/systems/{systemId}/schedule/{scheduleId}:
    parameters:
    - $ref: '#/components/parameters/SystemId'
    - name: scheduleId
      in: path
      required: true
      schema:
        type: string
    - $ref: '#/components/parameters/SessionId'
    put:
      operationId: putV5SystemsSystemIdScheduleScheduleId
      tags:
      - schedule
      summary: Change a program
      x-coverage: facade
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TopazeOnOffProgram'
      responses:
        '200':
          $ref: '#/components/responses/OkUnmodelled'
        default:
          $ref: '#/components/responses/Error'
      x-observed: true
    delete:
      operationId: deleteV5SystemsSystemIdScheduleScheduleId
      tags:
      - schedule
      summary: Delete a program
      x-coverage: facade
      responses:
        '200':
          $ref: '#/components/responses/OkUnmodelled'
        default:
          $ref: '#/components/responses/Error'
      x-observed: true
  /v5/systems/{systemId}/schedule/activate:
    parameters:
    - $ref: '#/components/parameters/SystemId'
    - $ref: '#/components/parameters/SessionId'
    put:
      operationId: putV5SystemsSystemIdScheduleActivate
      tags:
      - schedule
      summary: Turn the schedule on or off
      description: A natural switch entity.
      x-coverage: facade
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TopazeScheduleActivationRequest'
      responses:
        '200':
          $ref: '#/components/responses/OkUnmodelled'
        default:
          $ref: '#/components/responses/Error'
      x-observed: true
  /v5/systems/{systemId}/automatisms:
    parameters:
    - $ref: '#/components/parameters/SystemId'
    - $ref: '#/components/parameters/SessionId'
    get:
      operationId: getV5SystemsSystemIdAutomatisms
      tags:
      - automation
