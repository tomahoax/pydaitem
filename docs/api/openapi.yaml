components:
  parameters:
    SessionId:
      name: X-SessionId
      in: header
      required: false
      description: The panel session id (ttmSessionId from connect). Declared on every operation.
      schema:
        type: string
    Vendor:
      name: X-Vendor
      in: header
      required: true
      description: 'Brand: daitem here. Declared on user info, logout, connect and push registration.'
      schema:
        $ref: '#/components/schemas/XVendor'
    ForwardedFor:
      name: X-Forwarded-For
      in: header
      required: true
      description: Client address. Declared on connect and on camera captures.
      schema:
        type: string
    AppVersion:
      name: X-App-Version
      in: header
      required: true
      description: The app version. Required by connect, free-form.
      schema:
        type: string
    AppPlatform:
      name: X-App-Platform
      in: header
      required: true
      description: The platform. Optional.
      schema:
        type: string
    SystemId:
      in: path
      name: systemId
      required: true
      schema:
        type: integer
    UserId:
      in: path
      name: userId
      required: true
      schema:
        type: integer
    ScenarioId:
      in: path
      name: scenarioId
      required: true
      schema:
        type: integer
    TransactionId:
      in: path
      name: transactionId
      required: true
      schema:
        type: string
  securitySchemes:
    keycloak:
      type: oauth2
      description: Keycloak realm daitem, client daitem-secure-app, PKCE S256, redirect URI daitemsecure://auth.
      flows:
        authorizationCode:
          authorizationUrl: https://auth.atraltech.com/realms/daitem/protocol/openid-connect/auth
          tokenUrl: https://auth.atraltech.com/realms/daitem/protocol/openid-connect/token
          scopes:
            openid: OpenID Connect
    appName:
      type: apiKey
      in: header
      name: X-App-Name
      description: Always eNova.
  responses:
    Error:
      description: Business error. `message` is one of the codes listed in TopazeExceptionMessage.message,
        explained in docs/api/reference.md.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TopazeExceptionMessage'
    SessionBusy:
      description: Another device already holds the panel session. `details` names the holder. The panel
        allows a single session across all accounts, so this is expected whenever the mobile app is open;
        retry later.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TopazeExceptionMessage'
          examples:
            ownerHoldsSession:
              value:
                message: transmitter.connection.sessionalreadyopen
                details: 'owner '
    NoSession:
      description: No usable panel session. Both variants are remedied by calling `connect`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TopazeExceptionMessage'
          examples:
            noSession:
              summary: No session at all
              value:
                message: status.nottmsessionid
                details: Failed to get last TTM session
            staleSession:
              summary: A session exists but its id is stale
              value:
                message: transmitter.error.invalidsessionid
                details: 'Invalid session id: <hex>'
    Forbidden:
      description: 'The account lacks rights for this resource. Known case: the logbook is owner-only.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TopazeExceptionMessage'
    OkUnmodelled:
      description: OK (body not modelled)
  schemas:
    SsoAuthToken:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
        refresh_expires_in:
          type: integer
        id_token:
          type: string
      required:
      - access_token
      - refresh_token
      - expires_in
      - refresh_expires_in
    TopazeError:
      type: object
      properties:
        message:
          type: string
        details:
          type: string
    TopazeSystemCode:
      type: object
      properties:
        code:
          type: string
        codeSize:
          type: integer
      required:
      - code
    TopazeEdaitemConfiguration:
      type: object
      properties:
        countries:
          type: array
          items:
            type: string
      required:
      - countries
    TopazeAutomatismListResponse:
      type: object
      properties:
        automatisms:
          type: array
          items:
            $ref: '#/components/schemas/TopazeAutomatism'
    TopazeAutomatism:
      type: object
